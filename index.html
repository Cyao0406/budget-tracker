<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簡單記帳</title>
<meta name="description" content="快速記錄每日收支，自動分類並生成報表">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- Header -->
  <header class="topbar">
    <h1 class="brand">簡單記帳</h1>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="themeToggleBtn" title="切換深色/淺色" aria-label="切換深色/淺色模式">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button type="button" class="icon-btn" id="settingsBtn" title="分類與關鍵字設定" aria-label="開啟設定">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="content">

    <!-- Date selector -->
    <section class="date-bar">
      <button type="button" class="date-nav" id="datePrevBtn" aria-label="前一天">‹</button>
      <button type="button" class="date-display" id="dateDisplayBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="dateDisplayText">今天</span>
      </button>
      <button type="button" class="date-nav" id="dateNextBtn" aria-label="後一天">›</button>
      <button type="button" class="today-btn" id="todayBtn">回今天</button>
    </section>

    <!-- Custom calendar popup -->
    <div class="calendar-popup hidden" id="calendarPopup">
      <div class="calendar-head">
        <button type="button" id="calPrevMonth" aria-label="上個月">‹</button>
        <span id="calMonthLabel"></span>
        <button type="button" id="calNextMonth" aria-label="下個月">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Period tabs -->
    <nav class="period-tabs" id="periodTabs" role="tablist" aria-label="統計週期">
      <button type="button" class="period-tab active" data-period="day" role="tab" aria-selected="true">日</button>
      <button type="button" class="period-tab" data-period="week" role="tab" aria-selected="false">週</button>
      <button type="button" class="period-tab" data-period="month" role="tab" aria-selected="false">月</button>
    </nav>

    <!-- Summary card -->
    <section class="card summary-card">
      <p class="period-range" id="periodRangeLabel"></p>
      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-label">支出</span>
          <span class="stat-value expense" id="statExpense">$0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">收入</span>
          <span class="stat-value income" id="statIncome">$0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">結餘</span>
          <span class="stat-value" id="statBalance">$0</span>
        </div>
      </div>

      <div class="chart-toggle" role="tablist" aria-label="圖表類型">
        <button type="button" class="chart-toggle-btn active" data-chart-type="expense" role="tab" aria-selected="true">支出佔比</button>
        <button type="button" class="chart-toggle-btn" data-chart-type="income" role="tab" aria-selected="false">收入佔比</button>
      </div>

      <div class="chart-wrap">
        <svg id="pieChart" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="pieChartDesc"></svg>
        <div class="chart-empty hidden" id="chartEmpty">這段期間還沒有紀錄</div>
        <p class="sr-only" id="pieChartDesc">分類佔比圓餅圖</p>
      </div>
      <ul class="legend" id="chartLegend"></ul>
    </section>

    <!-- Quick add form -->
    <section class="card add-card">
      <div class="type-toggle" role="tablist" aria-label="收支類型">
        <button type="button" class="type-toggle-btn expense active" data-type="expense" role="tab" aria-selected="true">支出</button>
        <button type="button" class="type-toggle-btn income" data-type="income" role="tab" aria-selected="false">收入</button>
      </div>

      <form id="quickAddForm" autocomplete="off">
        <div class="quick-input-row">
          <input type="text" id="quickInput" placeholder="例如：早餐 全家 150" inputmode="text" aria-label="快速輸入項目與金額">
          <button type="submit" class="add-btn" id="addBtn" aria-label="新增紀錄">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <p class="hint">格式：項目內容 金額（最後的數字會被判斷為金額，並自動猜測分類）</p>

        <div class="parse-preview hidden" id="parsePreview">
          <span class="parse-amount" id="parseAmount"></span>
          <span class="parse-note" id="parseNote"></span>
          <button type="button" class="category-chip" id="parseCategoryChip"></button>
        </div>

        <button type="button" class="advanced-toggle" id="advancedToggle">進階選項 ▾</button>

        <div class="advanced-fields hidden" id="advancedFields">
          <label class="field">
            <span>分類</span>
            <select id="manualCategory"></select>
          </label>
          <label class="field">
            <span>金額</span>
            <input type="number" id="manualAmount" inputmode="decimal" min="0" step="1" placeholder="0">
          </label>
          <label class="field">
            <span>備註</span>
            <input type="text" id="manualNote" placeholder="選填">
          </label>
        </div>
      </form>
    </section>

    <!-- Category quick-pick popup -->
    <div class="sheet hidden" id="categoryPickSheet">
      <div class="sheet-backdrop" id="categoryPickBackdrop"></div>
      <div class="sheet-body">
        <h2>選擇分類</h2>
        <div class="category-grid" id="categoryPickGrid"></div>
        <button type="button" class="sheet-close" id="categoryPickClose">取消</button>
      </div>
    </div>

    <!-- Merge-target picker (shown when deleting a category) -->
    <div class="sheet hidden" id="mergeCategorySheet">
      <div class="sheet-backdrop" id="mergeCategoryBackdrop"></div>
      <div class="sheet-body">
        <h2 id="mergeCategoryTitle">選擇要轉移到的分類</h2>
        <div class="category-grid" id="mergeCategoryGrid"></div>
        <button type="button" class="sheet-close" id="mergeCategoryCancel">取消</button>
      </div>
    </div>

    <!-- Records list -->
    <section class="card records-card">
      <div class="records-head">
        <h2>紀錄</h2>
        <button type="button" class="text-btn" id="exportBtn">匯出 CSV</button>
      </div>
      <p class="hint">點一下紀錄可以編輯</p>
      <div id="recordsList" class="records-list">
        <p class="empty-msg" id="recordsEmptyMsg">這段期間還沒有紀錄，開始記一筆吧！</p>
      </div>
    </section>

  </main>

  <!-- Edit record modal -->
  <div class="sheet hidden" id="editRecordSheet">
    <div class="sheet-backdrop" id="editRecordBackdrop"></div>
    <div class="sheet-body">
      <div class="sheet-header">
        <h2>編輯紀錄</h2>
        <button type="button" class="icon-btn" id="editRecordCloseBtn" aria-label="關閉編輯">✕</button>
      </div>

      <div class="type-toggle" role="tablist" aria-label="收支類型">
        <button type="button" class="type-toggle-btn expense" data-edittype="expense" role="tab">支出</button>
        <button type="button" class="type-toggle-btn income" data-edittype="income" role="tab">收入</button>
      </div>

      <div class="advanced-fields">
        <label class="field">
          <span>日期</span>
          <input type="date" id="editDate">
        </label>
        <label class="field">
          <span>分類</span>
          <select id="editCategory"></select>
        </label>
        <label class="field">
          <span>金額</span>
          <input type="number" id="editAmount" inputmode="decimal" min="0" step="1">
        </label>
        <label class="field">
          <span>備註</span>
          <input type="text" id="editNote" placeholder="選填">
        </label>
      </div>

      <div class="edit-actions">
        <button type="button" class="text-btn danger" id="editDeleteBtn">刪除這筆</button>
        <button type="button" class="save-btn" id="editSaveBtn">儲存</button>
      </div>
    </div>
  </div>

  <!-- Settings modal: category & keyword management -->
  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-backdrop" id="settingsBackdrop"></div>
    <div class="sheet-body sheet-body-lg">
      <div class="sheet-header">
        <h2>分類與關鍵字設定</h2>
        <button type="button" class="icon-btn" id="settingsCloseBtn" aria-label="關閉設定">✕</button>
      </div>

      <div class="settings-type-toggle" role="tablist">
        <button type="button" class="type-toggle-btn expense active" data-settype="expense" role="tab" aria-selected="true">支出分類</button>
        <button type="button" class="type-toggle-btn income" data-settype="income" role="tab" aria-selected="false">收入分類</button>
      </div>

      <div id="categoryEditList" class="category-edit-list"></div>

      <button type="button" class="add-category-btn" id="addCategoryBtn">+ 新增分類</button>

      <hr class="divider">
      <div class="data-actions">
        <button type="button" class="text-btn" id="settingsExportBtn">匯出 CSV 備份</button>
        <label class="text-btn file-import-btn">
          匯入 CSV
          <input type="file" id="importFileInput" accept=".csv" hidden>
        </label>
        <button type="button" class="text-btn danger" id="resetDataBtn">清除所有資料</button>
      </div>
      <p class="hint">資料儲存在此瀏覽器裝置上（localStorage），清除瀏覽器資料會遺失紀錄，建議定期匯出 CSV 備份。匯入同時支援本 App 匯出的格式，以及 MoneyNote App 匯出的 CSV。</p>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

</div>

<script src="app.js"></script>
</body>
</html>
